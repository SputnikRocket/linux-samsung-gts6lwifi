name: Build kernel + boot.img (gts6lwifi / SM-T860)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name from arch/arm64/configs"
        type: string
        default: gts6lwifi_eur_open_defconfig
      extra_config:
        description: "Extra Kconfig options, space separated (e.g. CONFIG_RKP_CFP=n CONFIG_SECURITY_DEFEX=n)"
        type: string
        default: ""
      extra_make_args:
        description: "Extra make arguments, space separated"
        type: string
        default: ""
      extra_kcflags:
        description: "Extra compiler flags appended to KCFLAGS (e.g. -Wno-error)"
        type: string
        default: ""
      stock_boot_url:
        description: "URL of the stock boot.img (only used if stock/boot.img is not in the repo)"
        type: string
        default: ""
      ramdisk_url:
        description: "Optional replacement ramdisk/initramfs URL (cpio, gz, lz4, xz...). Empty = keep the stock ramdisk"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qualcomm's LLVM 8 (what Samsung builds with) is not public, so use AOSP's
  # prebuilt clang + GCC 4.9 binutils, which build 4.14 SM8150 trees fine.
  CLANG_VER: clang-r353983c
  CLANG_BRANCH: android10-release
  GCC_BRANCH: android10-release
  MAGISK_VERSION: v27.0
  STOCK_BOOT_PATH: stock/boot.img
  DTB_GLOB: "*gts6*.dtb"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEFCONFIG: ${{ inputs.defconfig || 'gts6lwifi_eur_open_defconfig' }}
      EXTRA_CONFIG: ${{ inputs.extra_config }}
      EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}
      EXTRA_KCFLAGS: ${{ inputs.extra_kcflags }}
      STOCK_BOOT_URL: ${{ inputs.stock_boot_url || vars.STOCK_BOOT_URL }}
      RAMDISK_URL: ${{ inputs.ramdisk_url || vars.RAMDISK_URL }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            xz-utils unzip curl git ca-certificates python3 python2 ccache \
            gcc-arm-linux-gnueabi
          # Samsung's scripts/rkp_cfp/instrument.py (run after vmlinux links) is Python 2 only,
          # and the runner's `python` is Python 3. Point `python` at python2 for this job.
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Restore toolchain cache
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains
          key: toolchains-${{ env.CLANG_VER }}-${{ env.CLANG_BRANCH }}-gcc4.9-${{ env.GCC_BRANCH }}

      - name: Download toolchains
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TC="$HOME/toolchains"
          mkdir -p "$TC/clang"
          curl -fL --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz" \
            | tar -xz -C "$TC/clang"
          git clone --depth=1 -b "$GCC_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$TC/gcc64"

      # Saved here (not at job end) so a failing build doesn't throw the download away.
      - name: Save toolchain cache
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains
          key: toolchains-${{ env.CLANG_VER }}-${{ env.CLANG_BRANCH }}-gcc4.9-${{ env.GCC_BRANCH }}

      # ccache turns the ~13 min full compile into a couple of minutes on re-runs.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEFCONFIG }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEFCONFIG }}-

      - name: Build kernel
        run: |
          set -euo pipefail
          TC="$HOME/toolchains"
          export PATH="$TC/clang/bin:$TC/gcc64/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=2G CCACHE_BASEDIR="$PWD"
          ccache -z >/dev/null
          clang --version | head -n1
          aarch64-linux-android-gcc --version | head -n1
          python --version

          # dist/kernel -> "kernel" artifact, dist/modules -> "modules", dist/boot -> "boot-img"
          mkdir -p dist/kernel/dtbs dist/modules dist/boot
          LOG=dist/kernel/build.log

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::arch/arm64/configs/$DEFCONFIG not found. Closest matches:"
            ls arch/arm64/configs | grep -i -e gts6 -e t860 -e sm8150 || true
            exit 1
          fi

          make_args=(
            -j"$(nproc)"
            O=out ARCH=arm64
            CC="ccache clang" REAL_CC=clang
            HOSTCC="gcc -fcommon"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CONFIG_BUILD_ARM64_DT_OVERLAY=y
            # Samsung code (e.g. security/samsung/five) includes "security/integrity/integrity.h",
            # which needs the source root on the include path; with O=out the relative
            # root gets mangled by kbuild, so pass it as an absolute path.
            KCFLAGS="-I$PWD ${EXTRA_KCFLAGS:-}"
          )
          # Samsung ships a prebuilt dtc in tools/ and builds with DTC_EXT
          if [ -f tools/dtc ]; then
            chmod +x tools/dtc
            make_args+=(DTC_EXT="$PWD/tools/dtc")
          fi
          if [ -n "${EXTRA_MAKE_ARGS:-}" ]; then
            read -r -a extra <<<"$EXTRA_MAKE_ARGS"
            make_args+=("${extra[@]}")
          fi

          make "${make_args[@]}" "$DEFCONFIG"

          if [ -n "${EXTRA_CONFIG:-}" ]; then
            tr ' ' '\n' <<<"$EXTRA_CONFIG" >> out/.config
            make "${make_args[@]}" olddefconfig
          fi

          # Exact names of Samsung's RKP / hypervisor / DEFEX options, for use with extra_config
          echo "::group::Samsung security-related config symbols"
          grep -E 'RKP|CFP|_UH[_=]|KDP|DEFEX|APPENDED_DTB' out/.config | grep -v '^#' | sort || true
          echo "::endgroup::"

          # -k: keep compiling after a failure so a single run lists every broken file
          set +e
          make -k "${make_args[@]}" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          ccache -s | head -n 12 || true
          [ "$rc" -eq 0 ] || exit "$rc"

          # ---- collect outputs ----
          B=out/arch/arm64/boot
          [ -f "$B/Image" ] || { echo "::error::build finished without producing $B/Image"; exit 1; }

          # Samsung's default target doesn't build the DTBs (the appended-DTB list in the
          # defconfig is empty), so build them explicitly if none exist yet.
          ndtb=$(find "$B/dts" -name '*.dtb' 2>/dev/null | wc -l)
          if [ "$ndtb" -eq 0 ]; then
            echo "::group::make dtbs"
            make -k "${make_args[@]}" dtbs 2>&1 | tee -a "$LOG" || echo "::warning::dtbs target failed"
            echo "::endgroup::"
          fi

          for f in Image Image.gz Image.gz-dtb Image-dtb; do
            if [ -f "$B/$f" ]; then cp "$B/$f" dist/kernel/; fi
          done
          find "$B/dts" \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -t dist/kernel/dtbs {} + || true
          cp out/.config dist/kernel/config
          make "${make_args[@]}" -s kernelrelease 2>/dev/null | tail -n1 > dist/kernel/kernelrelease.txt || true

          # Modules: install into a staging dir, drop the build/ and source/ symlinks that
          # point back into the source tree (artifact upload would follow them and pack
          # the whole repo), then ship one tarball.
          if grep -q '^CONFIG_MODULES=y' out/.config; then
            stage="$RUNNER_TEMP/modules-root"; rm -rf "$stage"
            if make "${make_args[@]}" INSTALL_MOD_PATH="$stage" INSTALL_MOD_STRIP=1 modules_install; then
              find "$stage" -maxdepth 4 -type l \( -name build -o -name source \) -delete
              rel="$(tr -d '\n' < dist/kernel/kernelrelease.txt)"
              tar -C "$stage" -czf "dist/modules/modules-${rel:-unknown}.tar.gz" lib
            else
              echo "::warning::modules_install failed (continuing)"
            fi
          fi
          ls -lh dist/kernel dist/kernel/dtbs dist/modules

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEFCONFIG }}-${{ github.sha }}

      - name: Summarize build errors
        if: failure()
        run: |
          [ -f dist/kernel/build.log ] || exit 0
          {
            echo '### Build errors'
            echo '```'
            # SyntaxError/Traceback catch script failures (e.g. Samsung's Python helpers);
            # -B3 shows the lines leading up to each hit.
            grep -nE -B3 'SyntaxError|Traceback|error:|\*\*\* \[|undefined reference' dist/kernel/build.log \
              | grep -vE 'ambiguous argument|to separate paths from revisions' | head -n 80 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Locate stock boot.img
        id: stock
        run: |
          set -euo pipefail
          path=""
          if [ -f "$STOCK_BOOT_PATH" ]; then
            path="$GITHUB_WORKSPACE/$STOCK_BOOT_PATH"
          elif [ -n "${STOCK_BOOT_URL:-}" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/stock-boot.img" "$STOCK_BOOT_URL"
            path="$RUNNER_TEMP/stock-boot.img"
          fi
          if [ -n "$path" ]; then
            head -c 8 "$path" | grep -q 'ANDROID!' || { echo "::error::$path is not an Android boot image"; exit 1; }
          else
            echo "::notice::No stock boot.img (stock/boot.img or STOCK_BOOT_URL) - skipping boot.img repack"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Repack boot.img
        if: steps.stock.outputs.path != ''
        env:
          STOCK: ${{ steps.stock.outputs.path }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/bootimg"
          B="$GITHUB_WORKSPACE/out/arch/arm64/boot"
          rm -rf "$WORK"; mkdir -p "$WORK/unpacked" "$GITHUB_WORKSPACE/dist/boot"

          # magiskboot: static x86_64 binary shipped inside the Magisk APK
          curl -fL --retry 3 -o "$WORK/magisk.apk" \
            "https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"
          unzip -p "$WORK/magisk.apk" lib/x86_64/libmagiskboot.so > "$WORK/magiskboot"
          chmod +x "$WORK/magiskboot"
          MB="$WORK/magiskboot"

          # All built DTBs for this device, concatenated (the bootloader picks by board-id/rev)
          dtb_blob() {
            mapfile -t files < <(find "$B/dts" -name "$DTB_GLOB" | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::warning::no DTB matched $DTB_GLOB, using every .dtb" >&2
              mapfile -t files < <(find "$B/dts" -name '*.dtb' | sort)
            fi
            [ "${#files[@]}" -gt 0 ] || { echo "::error::no .dtb files were built" >&2; return 1; }
            cat "${files[@]}"
          }

          cd "$WORK/unpacked"
          "$MB" unpack -h "$STOCK" 2>&1 | tee ../unpack.log
          echo "--- stock components ---"; ls -l

          [ -f kernel ] || { echo "::error::no kernel component found in the stock boot.img"; exit 1; }

          # Qualcomm SM8150 kernels can be shipped uncompressed behind a 'UNCOMPRESSED_IMG'
          # header (the kernel build emits that as Image-dtb). If the stock image does that,
          # the replacement must too; otherwise give magiskboot the raw Image and let it
          # recompress to the original format.
          if head -c 16 kernel | grep -qa '^UNCOMPRESSED_IMG'; then
            echo "Stock kernel has the UNCOMPRESSED_IMG header -> using Image-dtb"
            [ -f "$B/Image-dtb" ] || { echo "::error::Image-dtb was not built"; exit 1; }
            cp "$B/Image-dtb" kernel
          else
            echo "Stock kernel is a plain/compressed Image -> using raw Image"
            cp "$B/Image" kernel
          fi

          if [ -f kernel_dtb ] || [ -f dtb ]; then
            dtb_blob > "$WORK/dtb.new"
            [ -s "$WORK/dtb.new" ] || { echo "::error::empty DTB blob"; exit 1; }
            [ "$(head -c 4 "$WORK/dtb.new" | od -An -tx1 | tr -d ' \n')" = "d00dfeed" ] || { echo "::error::DTB blob has no FDT magic"; exit 1; }
            if [ -f kernel_dtb ]; then cp "$WORK/dtb.new" kernel_dtb; fi
            if [ -f dtb ]; then cp "$WORK/dtb.new" dtb; fi
          else
            echo "::warning::stock boot.img has no separate DTB component; DTBs (if any) stay inside the kernel image"
          fi

          if [ -n "${RAMDISK_URL:-}" ]; then
            curl -fL --retry 3 -o "$WORK/ramdisk.in" "$RAMDISK_URL"
            if head -c 6 "$WORK/ramdisk.in" | grep -q '^07070[12]'; then
              cp "$WORK/ramdisk.in" ramdisk.cpio
            else
              "$MB" decompress "$WORK/ramdisk.in" ramdisk.cpio
            fi
          fi

          "$MB" repack "$STOCK" "$GITHUB_WORKSPACE/dist/boot/boot.img"

          # sanity check: the result must unpack again
          mkdir -p "$WORK/verify"; cd "$WORK/verify"
          "$MB" unpack "$GITHUB_WORKSPACE/dist/boot/boot.img" >/dev/null
          ls -l
          cd "$GITHUB_WORKSPACE/dist/boot"
          ls -l "$STOCK" boot.img
          sha256sum boot.img | tee boot.img.sha256

      # Three separate artifacts: kernel (Image/DTBs/config/log), modules, boot.img
      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gts6lwifi-kernel-${{ github.run_number }}
          path: dist/kernel/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload modules artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gts6lwifi-modules-${{ github.run_number }}
          path: dist/modules/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0   # already a .tar.gz

      - name: Upload boot.img artifact
        if: always() && steps.stock.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: gts6lwifi-boot-img-${{ github.run_number }}
          path: dist/boot/
          if-no-files-found: warn
          retention-days: 30
